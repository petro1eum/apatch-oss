site_name: apatch — Governed Mutation System
site_description: Concept graph, governed executable specs, and TrustChain attestation
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

markdown_extensions:
  - attr_list
  - def_list
  - md_in_html
  - tables
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details          # §3.8 reader-depth: collapsible "guts"
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

# NOTE (RFP-034): Level 1 — renders the existing markdown beautifully (theme, search,
# collapsible reader-depth). Level 2 (concept-graph: clickable concept-id nodes, C4 tree,
# guarded/grey/red status badges, the clarify loop) needs the concept-layer compile
# (Part B Phase 1) and is a later phase. No explicit nav yet — Material auto-builds it
# from the docs/ tree; a curated C4 nav comes with Level 2.