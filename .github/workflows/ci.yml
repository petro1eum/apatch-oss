name: Public OSS candidate checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      APATCH_WORKSPACE_REGISTRY: ${{ runner.temp }}/apatch-public-workspaces.json
      APATCH_SKIP_SLOW: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public dependencies
        run: python -m pip install -e ".[dev,mcp,trustchain,yaml,platform,languages]"
      - name: Check public documentation and source boundary
        run: python -m pytest tests/test_public_source_boundary.py tests/test_public_freeze_portability.py -q
      - name: Verify complete contract before test-generated runtime caches
        run: |
          python -m apatch.cli conformance gate --live --ci-safe --jobs 2 --requirement-jobs 1 --json > "${{ runner.temp }}/apatch-conformance.json"
          python scripts/check_public_conformance.py "${{ runner.temp }}/apatch-conformance.json"
      - name: Run regression suite
        run: python -m pytest tests/ -q
      - name: Build source distribution and wheel
        run: python -m build --outdir "${{ runner.temp }}/apatch-dist"
      - name: Check artifact boundaries
        run: python -m pytest tests/test_distribution.py -q

# No private source checkout, persisted credential, production identity or old
# inclusion proof is imported. This workflow proves its stated local checks;
# external transparency/acceptance requires separately qualified fresh evidence.
