[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apatch"
version = "0.8.44"
description = "Executable contracts for AI agents: scoped changes, frozen verification, and signed evidence"
readme = "README.pypi.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ed Cherednik" },
]
keywords = ["ast", "tree-sitter", "patch", "diff", "llm", "agent", "refactor"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "trustchain>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/petro1eum/apatch-oss"
Documentation = "https://github.com/petro1eum/apatch-oss#readme"
Repository = "https://github.com/petro1eum/apatch-oss"
Issues = "https://github.com/petro1eum/apatch-oss/issues"

[project.optional-dependencies]
# Backward-compatible alias for existing `apatch[trustchain]` install commands.
# TrustChain is a base dependency from 0.8.44 because signed contract evidence is
# part of APatch itself, not an optional service integration.
trustchain = []
# Contribution / Avatar emission — the ONE shared canonical ContributionEvent
# schema (Avatar Architecture Canon §7, Rule 1). Every avatar_contract import is
# inside a function, so bare apatch neither needs nor imports it.
#
# There is deliberately no `avatar` extra: avatar-contract is not in the package
# index, and an extra can only reach it by a direct URL. A distribution whose
# metadata carries a direct reference is refused at upload, which would keep apatch
# unpublishable for the sake of an optional peer. Until a registry release exists,
# install it explicitly next to apatch:
#
#   pip install "avatar-contract @ git+https://github.com/petro1eum/avatar-contract.git@e8cee1689e2b661b8b7258d9c939fa1a3839cefb"
#
# That commit is the pinned MIT contract; keep this comment in step with it.
# YAML strip manifests.
yaml = ["pyyaml>=6.0"]
# Optional tree-sitter grammars for AST-fuzzy matching beyond the core six.
# The matcher loads these lazily and falls back to whitespace-fuzzy when a
# grammar is missing, so installing this extra is purely additive.
languages = [
    "tree-sitter-java>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
    "tree-sitter-ruby>=0.21.0",
    "tree-sitter-php>=0.22.0",
]
dev = [
    "setuptools>=77.0.3",
    "pytest>=7.0.0",
    "pytest-asyncio",
    "build>=1.2.0",
    "wheel>=0.43",
    "tomli>=2.0; python_version < '3.11'",
]
platform = ["httpx>=0.27.0", "cryptography>=42.0.0"]
mcp = ["mcp>=1.0.0,<2.0.0"]

[project.scripts]
apatch = "apatch.cli:cli"
apatch-native-convert = "apatch.native_converter:main"
apatch-mcp = "apatch.mcp.launcher:main"
apatch-mcp-ws = "apatch.mcp.workspace_launcher:main"

[tool.setuptools.packages.find]
include = ["apatch", "apatch.*", "apatch_search_workflows", "apatch_search_workflows.*"]

[tool.setuptools.package-data]
"apatch.extensions" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: large monorepo / perf regression (ADR-001 §7); skip with APATCH_SKIP_SLOW=1",
]
